# git-cliff configuration — Conventional Commits -> Keep a Changelog.
[changelog]
header = """
# Changelog

All notable changes to this project are documented here, following
[Keep a Changelog](https://keepachangelog.com) and
[Semantic Versioning](https://semver.org).
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
"""
# Keep a Changelog verlangt anklickbare Versions-Überschriften. Die Referenzen
# stehen deshalb im Footer: Unreleased und jede Version vergleichen gegen ihren
# Vorgänger, die älteste zeigt auf ihren Release-Tag.
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/freaxnx01/game-stylestar/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/freaxnx01/game-stylestar/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/freaxnx01/game-stylestar/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true
# Der Footer wird als eigenes Segment gerendert und beginnt deshalb direkt auf
# der Zeile nach dem letzten Eintrag. Ohne Leerzeile davor schluckt Markdown die
# Link-Definitionen als Fortsetzung des letzten Listenpunkts.
postprocessors = [
  { pattern = "\\[Unreleased\\]:", replace = "\n[Unreleased]:" },
]

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
]
tag_pattern = "v[0-9]*"
