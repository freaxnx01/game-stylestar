name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Kein npm ci: das Projekt hat keine Dependencies und keine Lockfile.
      # node --test ist in Node enthalten.
      - run: npm test
